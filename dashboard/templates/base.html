<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Fitness Planner{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="/static/style.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="bg-stone-50 text-stone-900 antialiased">
  <nav class="bg-white border-b border-stone-200 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-6">
      <a href="/" class="font-semibold text-stone-900 tracking-tight">Fitness Planner</a>
      <div class="flex gap-4 text-sm">
        <a class="text-stone-600 hover:text-stone-900" href="/">This week</a>
        <a class="text-stone-600 hover:text-stone-900" href="/week/offset/1">Next week</a>
        <a class="text-stone-600 hover:text-stone-900" href="/season">Season plan</a>
        <a class="text-stone-600 hover:text-stone-900" href="/exercises">Exercises</a>
        <a class="text-stone-600 hover:text-stone-900" href="/stats">Stats</a>
      </div>
      <div class="ml-auto text-xs text-stone-500">
        {{ today.strftime('%a %d %b %Y') }}
      </div>
    </div>
  </nav>
  <main class="max-w-6xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
  <footer class="max-w-6xl mx-auto px-4 py-8 text-xs text-stone-400">
    Read-only view. Edit markdown in <code class="font-mono">plans/</code>, <code class="font-mono">concepts/</code>, <code class="font-mono">exercises/</code> directly.
  </footer>
</body>
</html>
